[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-briefing-skill"
version = "0.1.0"
description = "Portable agent skill for technical intelligence collection, curation, visualisation, and email briefings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.22",
  "pypdf>=5.0",
  "python-dateutil>=2.9",
  "PyYAML>=6.0",
]

[project.scripts]
technical-briefing = "briefing_skill.cli:main"

[tool.setuptools.packages.find]
include = ["briefing_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
