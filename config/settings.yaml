version: 1
timezone: Asia/Shanghai
language: zh-CN
collection_overlap_hours: 48
http_timeout_seconds: 25
http_user_agent: TechnicalBriefingSkill/0.1 (+internal research workflow)
max_raw_items_per_source: 300
max_relevance_batch: 12
max_fulltext_chars: 140000
fact_chunk_chars: 28000
fact_chunk_overlap_chars: 1200
brief_item_min_chars: 300
brief_item_max_chars: 450
issue_schedule: monday_wednesday_friday
require_human_approval: true
issue_mode: expanded_v2
render:
  style: swiss
  accent: ikb
  card_ratio: xhs
  email_width_px: 720
  force_validator: true
visuals:
  max_material_illustrations_per_issue: 3
  persona_max_appearances_per_issue: 2
  persona_default_mode: none
  persona_reference: assets/persona/reference.jpg
  allow_text_only_fallback: true

# Open-web search only fills gaps left by fixed feeds. Horizontal AI Infra,
# Agent, KVCache and storage/media signals stay visible through Radar.
agent_web_search_max_queries: 4

efficiency:
  deep_topics:
    - tpn
    - memory_dsa
    - dpu_inline
    - agent_acceleration
    - cross_region
    - optical_network
  radar_topics:
    - ai_infra_horizontal
  auto_accept_rule_score: 85
  auto_reject_rule_score: 15
  radar_promotion_rule_score: 88
  max_fact_candidates_total: 10
  max_fact_candidates_per_topic: 3
