version: 1
weights:
  project_relevance: 30
  novelty: 20
  evidence_quality: 20
  technical_depth: 15
  actionability: 10
  freshness: 5

thresholds:
  relevance_fulltext: 65
  candidate_minimum: 55
  issue_minimum: 70
  max_issue_items: 6
  min_issue_items: 4
  max_items_per_topic: 2

# Optional expanded email mode. Core evidence standards remain unchanged;
# lower-scored entries are shown only in a separately labelled observation pool.
expanded_v2:
  # Preferred minima never cause weak or stale filler to be selected.
  core_min: 0
  core_max: 14
  observation_max: 4
  total_min: 0
  total_max: 18
  max_per_topic: 3
  core_score: 70
  observation_score: 60

freshness_gates:
  core_max_age_days: 3
  adjacent_max_age_days: 7
  absolute_max_age_days: 14
  unknown_published_at: exclude

radar:
  max_age_days: 7
  total_max: 6
  max_per_category: 2

source_level_score:
  A: 20
  B: 12
  C: 5

# Discovery bonuses are deliberately small. AI HOT can make a candidate appear
# earlier, but cannot make weak evidence pass the final gate.
discovery_bonuses:
  aihot_high_priority: 4
  multiple_independent_sources: 3
  primary_source_resolved: 5
  github_release: 3

freshness_days:
  2: 5
  7: 4
  30: 2
  90: 1
