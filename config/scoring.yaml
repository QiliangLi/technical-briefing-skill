version: 1
weights:
  project_relevance: 30
  novelty: 20
  evidence_quality: 20
  technical_depth: 15
  actionability: 10
  freshness: 5

thresholds:
  relevance_fulltext: 65
  candidate_minimum: 55
  issue_minimum: 70
  max_issue_items: 6
  min_issue_items: 4
  max_items_per_topic: 2

# Optional expanded email mode. Core evidence standards remain unchanged.
# Capacity follows the deep-topic product rule: up to four detailed items per
# configured deep topic. Topic ranking, rather than a global competition,
# decides which items receive the expensive path.
expanded_v2:
  core_min: 0
  core_max: 36
  observation_max: 36
  total_min: 0
  total_max: 36
  max_per_topic: 4
  # Fill each topic toward four detailed cards: current short-form items first,
  # then fact-checked historical brief-only items. If the combined legal pool is
  # smaller, publish fewer. A source that was ever detailed is never eligible.
  # Older brief-only cards retain the configured legacy text floor; the upgrade
  # changes publication role and must not be blocked by a later format change.
  topic_target: 4
  topic_floor_allow_brief_upgrade: true
  core_score: 70
  observation_score: 60

# Deep topics use a rolling backlog rather than a breaking-news-only gate.
# Already-pushed identities are still excluded, so older high-value work can
# surface gradually over subsequent issues without repeating prior coverage.
freshness_gates:
  core_max_age_days: 60
  adjacent_max_age_days: 60
  absolute_max_age_days: 60
  unknown_published_at: exclude

# Horizontal Radar stays recent and news-like. Final publication applies a
# current-run reserve refill and a cardinality invariant: with >=8 legal signals
# at least 5 must survive; with 4-7 at least 3 must survive (bounded by capacity).
# direct_copy=true selects radar deterministically from frozen upstream copy
# (no Agent rewriting); set false to fall back to synthesis-written signals.
radar:
  max_age_days: 7
  total_max: 16
  # Five slots avoid underfilling when one of the four categories is sparse;
  # total_max still caps the complete Radar at sixteen.
  max_per_category: 5
  # AI HOT supplies frozen Chinese copy; reserve at least half the issue for
  # official company/engineering or individual-builder original links when
  # enough such candidates exist.
  industry_builder_min: 8
  direct_copy: true

source_level_score:
  A: 20
  B: 12
  C: 5
discovery_bonuses:
  aihot_high_priority: 4
  multiple_independent_sources: 3
  primary_source_resolved: 5
  github_release: 3

freshness_days:
  2: 5
  7: 4
  30: 2
  60: 1
  90: 0
