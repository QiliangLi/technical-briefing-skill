version: 1

topic:
  id: frontier_exploration
  name: 边界探索
  description: >-
    不以当前项目相关性为前提，主动从操作系统、数据库、分布式系统、HPC、编译器、
    运行时、新型硬件与介质等相邻或更远领域寻找可迁移机制、反直觉结果和新架构。
    “暂时与现有项目无直接关系”不是负面信号；核心问题是它是否能拓宽技术假设空间。
  max_items_per_issue: 4
  aihot_priority: highest
  aihot_boost_terms:
    - systems research
    - operating system
    - database architecture
    - HPC runtime
    - compiler runtime
    - emerging memory
    - emerging storage
    - novel interconnect
    - agent harness
    - coding harness
    - agentic coding
    - agentic workflow
    - agentic system
  current_questions:
    - 哪些相邻领域的机制可以迁移到AI基础设施、存储、网络或Agent系统
    - 哪些反直觉实验结果正在挑战当前系统设计中的默认假设
    - 哪些新硬件、运行时或系统抽象值得在未来三个月形成新的验证Idea
  valuable_evidence: [机制新颖性, 可迁移性, 反直觉结果, 架构变化, 原型数据, 工程采用信号]
  directions:
    - id: systems_mechanism_transfer
      name: 系统机制迁移
      queries:
        - 'operating systems database distributed systems new mechanism performance'
        - 'HPC runtime scheduling communication novel architecture'
        - 'compiler runtime systems optimization architecture'
      aihot_queries: [systems research, distributed systems, HPC runtime, compiler runtime]
      arxiv_query: '((systems OR runtime OR database OR "distributed systems" OR HPC) AND (architecture OR scheduling OR mechanism))'
      include_terms: [system, runtime, database, distributed, hpc, compiler, scheduling, architecture]
      exclude_terms: [consumer app, marketing]
    - id: hardware_media_frontier
      name: 新硬件与介质
      queries:
        - 'emerging memory storage interconnect architecture systems'
        - 'novel accelerator packaging memory hierarchy systems'
        - 'new storage media controller architecture performance'
      aihot_queries: [emerging memory, new storage media, novel interconnect, chiplet packaging]
      arxiv_query: '((memory OR storage OR interconnect OR chiplet OR accelerator) AND (emerging OR novel OR architecture))'
      include_terms: [memory, storage, interconnect, accelerator, chiplet, media, hardware]
      exclude_terms: [consumer gpu, gaming]
    - id: agent_tooling_frontier
      name: Agent与工具链新机制
      queries:
        - 'agent runtime tool use novel systems mechanism'
        - 'software agent execution environment new architecture'
        - 'agent tooling workflow systems research'
        - 'agent harness coding harness long-running state evaluation'
        - 'agentic coding workflow system harness runtime'
      aihot_queries: [agent runtime, agent tooling, agent workflow, software agent systems, agent harness, coding harness, agentic coding, agentic workflow, agentic system]
      arxiv_query: '((agent OR agentic OR "agent harness" OR "coding harness" OR "agentic coding" OR "agentic workflow" OR "agentic system") AND (runtime OR tooling OR execution OR systems OR evaluation))'
      include_terms: [agent, agentic, agent harness, coding harness, agentic coding, agentic workflow, agentic system, runtime, tool, execution, workflow, systems]
      exclude_terms: [consumer chatbot, biomedical, healthcare workflow, business workflow, marketing automation]
