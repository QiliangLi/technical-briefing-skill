version: 1

topic:
  id: accelerator_io_datapath
  name: 加速器直连I/O与存储数据路径
  description: >-
    追踪AI/HPC场景下GPU、NPU或其他加速器与本地或远端持久化存储之间的
    I/O架构变化，包括直接数据路径、加速器主动发起或控制I/O、专用存储软件
    快路径，以及面向细粒度高并发加速器访问的存储控制器协同。
  max_items_per_issue: 4
  aihot_priority: high
  aihot_boost_terms:
    - GPUDirect Storage
    - GPU-initiated storage
    - GPU-initiated I/O
    - accelerator storage
    - SCADA
    - Storage-Next
    - cuFile
    - BaM
    - GIDS
  current_questions:
    - 加速器存储方案改变了I/O发起者、控制路径、数据路径或复制次数中的哪一项
    - CPU、Host DRAM、操作系统和驱动是否真正退出关键路径，仍保留哪些职责
    - 细粒度高并发访问需要怎样的SSD控制器、队列、ECC和设备接口
    - 路径变化能否改善GPU利用率、CPU占用、尾延迟、能效或端到端工作负载
    - 隔离、权限、错误恢复与部署成熟度是否足以支持生产使用
  valuable_evidence:
    - I/O发起者与control/data path
    - 数据复制次数与Host DRAM流量
    - I/O大小与队列深度
    - GPU线程或请求并发
    - IOPS与平均/尾时延
    - CPU与GPU利用率
    - 吞吐与端到端工作负载收益
    - 功耗、IOPS/W与成本口径
    - 隔离、错误恢复与部署状态
  directions:
    - id: direct_storage_path
      name: 加速器—存储直接数据路径
      queries:
        - '"GPUDirect Storage" direct data path GPU memory storage'
        - '(GPU OR accelerator) storage "direct data path" DMA P2P'
        - '(NVMe OR NVMe-oF) GPU memory direct storage bounce buffer'
      aihot_queries:
        - GPUDirect Storage
        - GPU storage direct data path
        - NVMe to GPU
      arxiv_query: '((GPU OR accelerator) AND (storage OR NVMe) AND ("direct data path" OR "peer-to-peer DMA" OR "bounce buffer"))'
      include_terms: [gpu, accelerator, storage, nvme, direct data path, gpudirect storage, bounce buffer, p2p]
      exclude_terms: [gaming, graphics, direct rendering, network only]
    - id: accelerator_initiated_io
      name: 加速器主动发起与控制I/O
      queries:
        - '"GPU-initiated storage" OR "GPU-initiated I/O"'
        - '(GPU OR accelerator) NVMe "control path" storage'
        - 'SCADA Storage-Next BaM GIDS GPU storage'
      aihot_queries:
        - GPU-initiated storage
        - GPU-initiated I/O
        - SCADA Storage-Next
        - BaM GIDS
      arxiv_query: '((GPU OR accelerator OR device) AND (storage OR NVMe) AND ("initiated I/O" OR "initiated storage" OR "control path" OR BaM OR GIDS OR SCADA))'
      include_terms: [gpu-initiated, accelerator, storage, nvme, control path, scada, storage-next, bam, gids]
      exclude_terms: [gaming, graphics, cpu-only]
    - id: accelerator_storage_stack
      name: 加速器存储软件快路径
      queries:
        - '(cuFile OR "GPU storage stack") direct storage GPU'
        - '(driver OR filesystem OR userspace) GPU storage fast path'
        - '(kernel bypass OR async I/O) accelerator storage path'
      aihot_queries:
        - cuFile storage
        - GPU storage stack
        - accelerator storage fast path
      arxiv_query: '((GPU OR accelerator) AND storage AND (cuFile OR "storage stack" OR "fast path" OR "kernel bypass" OR userspace))'
      include_terms: [gpu, accelerator, storage, cufile, storage stack, fast path, kernel bypass, userspace]
      exclude_terms: [generic filesystem, cpu-only, database only, networking only]
    - id: accelerator_storage_controller
      name: 细粒度I/O与存储控制器协同
      queries:
        - '(SSD controller OR NVMe controller) GPU-initiated storage'
        - '(SSD controller OR NVMe controller) fine-grained small-block GPU'
        - '(storage controller ECC queue) accelerator I/O'
      aihot_queries:
        - GPU SSD controller
        - fine-grained I/O SSD
        - small-block GPU storage
      arxiv_query: '(((SSD OR NVMe) AND controller) AND (GPU OR accelerator) AND ("fine-grained I/O" OR "small-block" OR "GPU-initiated" OR P2P))'
      include_terms: [ssd controller, nvme controller, gpu, accelerator, fine-grained, small-block, ecc, queue]
      exclude_terms: [capacity only, sequential bandwidth only, nand layer count, consumer ssd]
