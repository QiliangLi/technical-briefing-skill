version: 1

topic:
  id: storage_media
  name: 存储介质与器件
  description: >-
    面向容量、带宽、时延、耐久、功耗和密度演进的存储介质与器件技术，重点覆盖
    NAND/Flash/HBF、新型非易失存储、HDD磁记录以及介质与控制器协同；不把HBM、
    CXL内存语义或通用存储软件栈重复归入本专题。
  max_items_per_issue: 2
  aihot_priority: medium
  aihot_boost_terms:
    - NAND flash
    - QLC
    - High Bandwidth Flash
    - HBF
    - HAMR
    - MRAM
    - ReRAM
    - PCM
    - storage media
  current_questions:
    - 存储介质的密度、带宽、耐久和功耗正在发生哪些可量化变化
    - HBF或新型非易失存储是否正在改变AI系统的存储层级边界
    - 介质创新能否在真实设备和系统条件下转化为可部署的性能或成本收益
  valuable_evidence:
    - 容量密度
    - 顺序与随机带宽
    - 访问时延
    - P/E耐久
    - 写放大
    - 功耗
    - 成本/bit
    - 量产节点与时间
  directions:
    - id: flash_nand_hbf
      name: NAND、Flash与高带宽闪存
      queries:
        - 'NAND flash QLC TLC density endurance performance'
        - '"High Bandwidth Flash" HBF AI storage'
        - '3D NAND layer count bandwidth endurance'
      aihot_queries:
        - NAND flash
        - QLC SSD
        - High Bandwidth Flash
        - HBF storage
      arxiv_query: '((NAND OR flash OR QLC OR TLC OR "High Bandwidth Flash" OR HBF) AND (storage OR SSD OR memory))'
      include_terms: [nand, flash, qlc, tlc, high bandwidth flash, hbf, endurance, density]
      exclude_terms: [hbm, browser cache]
    - id: emerging_nvm
      name: 新型非易失存储器件
      queries:
        - 'MRAM ReRAM PCM non-volatile memory storage systems'
        - '"storage class memory" emerging NVM device'
        - 'ferroelectric memory persistent storage performance'
      aihot_queries:
        - MRAM
        - ReRAM
        - PCM memory
        - storage class memory
      arxiv_query: '((MRAM OR ReRAM OR PCM OR "phase change memory" OR "storage class memory" OR ferroelectric) AND (storage OR memory))'
      include_terms: [mram, reram, pcm, phase change memory, storage class memory, non-volatile, ferroelectric]
      exclude_terms: [cxl pooling, semantic memory]
    - id: magnetic_recording
      name: HDD与磁记录介质
      queries:
        - 'HAMR HDD areal density storage roadmap'
        - 'MAMR magnetic recording HDD capacity'
        - 'heat assisted magnetic recording reliability density'
      aihot_queries:
        - HAMR HDD
        - MAMR
        - magnetic recording
        - HDD areal density
      arxiv_query: '((HAMR OR MAMR OR "magnetic recording" OR HDD) AND (density OR storage OR reliability))'
      include_terms: [hamr, mamr, magnetic recording, hdd, areal density]
      exclude_terms: []
    - id: media_controller_codesign
      name: 介质与控制器协同
      queries:
        - 'flash controller FTL media characteristics write amplification'
        - 'SSD controller NAND endurance latency co-design'
        - 'ZNS SSD media management endurance'
      aihot_queries:
        - flash controller
        - FTL
        - SSD endurance
        - ZNS SSD
      arxiv_query: '((flash OR NAND OR SSD) AND (controller OR FTL OR ZNS) AND (endurance OR latency OR "write amplification"))'
      include_terms: [flash, nand, ssd, controller, ftl, zns, endurance, write amplification]
      exclude_terms: [dpu, smartnic, cxl memory]
