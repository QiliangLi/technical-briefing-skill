version: 1

# AI HOT is a discovery source, not a final evidence source.  The priority fields
# below only control query frequency and candidate ordering.
topics:
  - id: tpn
    name: 状态感知网络、TPN
    description: >-
      TPN特指阿里云Token Performance Network，同时扩展到KVCache感知网络、
      Prefill/Decode解耦通信和面向TTFT/TPOT的推理网络调度。
    max_items_per_issue: 2
    aihot_priority: high
    aihot_boost_terms:
      - KV cache
      - prefill decode
      - LLM serving
      - inference network
      - token throughput
    current_questions:
      - 网络是否能够感知推理阶段、KVCache位置和Token性能目标
      - 状态感知调度能否降低TTFT、TPOT或跨节点KVCache传输开销
      - 网络侧优化相对纯GPU内存调度增加了什么价值
    valuable_evidence:
      - TTFT
      - TPOT
      - token throughput
      - KVCache传输量
      - 网络利用率
      - 端到端P95
    directions:
      - id: tpn_direct
        name: TPN直接进展
        queries:
          - Token Performance Network
          - Token性能网络
          - 阿里云 TPN
        aihot_queries:
          - Token Performance Network
          - TPN 推理网络
        arxiv_query: '("token-aware" OR "inference-aware") AND network'
        include_terms: [token, network, inference, tpn]
        exclude_terms: [tokenizer vocabulary]
      - id: kv_network_scheduling
        name: KVCache感知的网络与带宽调度
        queries:
          - '"KV cache scheduling" network bandwidth'
          - '"KV cache-aware scheduling" communication'
          - '"KV cache placement" network'
        aihot_queries:
          - KV cache scheduling
          - KV cache network
          - KV cache placement
        arxiv_query: '("KV cache" AND (network OR communication OR bandwidth OR placement))'
        include_terms: [kv cache, network, communication, bandwidth, scheduling, placement]
        exclude_terms: [browser cache, cpu cache]
      - id: kv_transfer
        name: KVCache传输与通信优化
        queries:
          - '"KV cache transfer" network'
          - '"remote KV cache" RDMA'
          - '"KV cache communication" bandwidth latency'
        aihot_queries:
          - KV cache transfer
          - remote KV cache
          - KV cache RDMA
        arxiv_query: '("KV cache transfer" OR "remote KV cache" OR "KV cache communication")'
        include_terms: [kv cache, transfer, remote, communication]
        exclude_terms: [cpu cache]
      - id: pd_disaggregation
        name: Prefill/Decode解耦通信
        queries:
          - '"prefill decode disaggregation" communication'
          - '"disaggregated LLM serving" network scheduling'
          - '"KV cache handoff" prefill decode'
        aihot_queries:
          - prefill decode disaggregation
          - KV cache handoff
          - disaggregated inference
        arxiv_query: '("prefill decode" AND (disaggregation OR communication OR network))'
        include_terms: [prefill, decode, disaggregation, kv cache, communication]
        exclude_terms: []
      - id: token_metric_network
        name: 面向Token指标的网络优化
        queries:
          - '"inference-aware network" TTFT TPOT'
          - '"token-aware network" token throughput'
          - '"LLM network scheduling" TTFT'
        aihot_queries:
          - inference network TTFT
          - token-aware network
          - LLM network scheduling
        arxiv_query: '((TTFT OR TPOT OR "token throughput") AND network AND inference)'
        include_terms: [ttft, tpot, token throughput, network]
        exclude_terms: []

  - id: memory_dsa
    name: 内存语义、DSA卸载
    description: 内存池化、解耦内存、CXL语义以及DSA/IAA的数据搬移与数据处理算子卸载。
    max_items_per_issue: 2
    aihot_priority: medium
    aihot_boost_terms: [CXL, Intel DSA, Data Streaming Accelerator, memory pooling]
    current_questions:
      - 内存资源如何暴露可组合、可共享或远程访问语义
      - DSA或IAA能否减少CPU数据搬移和压缩校验开销
      - 卸载收益是否能够传导到端到端应用
    valuable_evidence: [CPU占用, 内存带宽, 吞吐, 时延, 队列深度, 端到端收益]
    directions:
      - id: memory_semantics
        name: 内存语义与池化
        queries:
          - '"memory semantics" disaggregated memory'
          - '"CXL memory pooling" semantics'
          - '"memory-centric architecture" pooling'
        aihot_queries: [CXL memory, disaggregated memory]
        arxiv_query: '("disaggregated memory" OR "CXL memory pooling" OR "memory semantics")'
        include_terms: [memory, cxl, disaggregated, pooling, semantics]
        exclude_terms: [psychology, semantic memory]
      - id: dsa_offload
        name: DSA数据搬移和算子卸载
        queries:
          - '"Intel DSA" memcpy data movement'
          - '"Data Streaming Accelerator" storage'
          - '"Intel IAA" compression checksum'
        aihot_queries: [Intel DSA, Data Streaming Accelerator, Intel IAA]
        arxiv_query: '(("Intel DSA" OR "Data Streaming Accelerator" OR "Intel IAA") AND (offload OR storage OR memory))'
        include_terms: [intel dsa, data streaming accelerator, intel iaa, data movement, offload]
        exclude_terms: [digital signature algorithm]

  - id: dpu_inline
    name: DPU随路卸载
    description: 数据经过DPU、SmartNIC或IPU时完成协议、存储、元数据、安全和缓存处理。
    max_items_per_issue: 2
    aihot_priority: medium
    aihot_boost_terms: [DPU, SmartNIC, BlueField, inline offload]
    current_questions:
      - 哪些数据路径操作可以在DPU上随路完成
      - 单点卸载覆盖率能否形成端到端收益
      - 元数据、协议、安全和缓存卸载如何组合
    valuable_evidence: [CPU降低比例, 端到端时延, 吞吐, 卸载覆盖率, 部署规模]
    directions:
      - id: inline_datapath
        name: 随路数据路径处理
        queries:
          - '(DPU OR SmartNIC OR IPU) "inline offload"'
          - '(DPU OR SmartNIC) "in-path processing"'
          - '(DPU OR SmartNIC) "data-path offload"'
        aihot_queries: [DPU inline offload, SmartNIC in-path processing, BlueField datapath]
        arxiv_query: '((DPU OR SmartNIC OR IPU) AND ("inline offload" OR "in-path processing" OR datapath))'
        include_terms: [dpu, smartnic, ipu, inline, datapath, offload]
        exclude_terms: []
      - id: protocol_metadata
        name: 协议、存储与元数据卸载
        queries:
          - '(DPU OR SmartNIC) S3 RDMA offload'
          - '(DPU OR SmartNIC) metadata offload storage'
          - '(DPU OR SmartNIC) NVMe-oF encryption compression'
        aihot_queries: [DPU storage offload, SmartNIC metadata, BlueField RDMA]
        arxiv_query: '((DPU OR SmartNIC) AND (S3 OR RDMA OR NVMe-oF OR metadata) AND offload)'
        include_terms: [dpu, smartnic, storage, metadata, rdma, s3, nvme]
        exclude_terms: []

  - id: agent_acceleration
    name: Agent语义加速
    description: >-
      减少Agent反复Read、Grep、Glob、代码探索、上下文构建和规划等待，
      从而缩短端到端任务完成时间的技术，而非仅指语义缓存。
    max_items_per_issue: 2
    aihot_priority: highest
    aihot_boost_terms:
      - coding agent
      - code graph
      - repository indexing
      - agent runtime
      - tool calls
      - harness
      - agent harness
      - coding harness
      - agentic coding
      - agentic workflow
      - agentic system
      - Claude Code
      - Codex
    current_questions:
      - 如何减少代码Agent重复Read、Grep和上下文定位
      - 代码知识图或仓库索引是否真正降低端到端任务时延
      - 工具调用并行、预测或复用是否引入正确性风险
      - Harness如何管理长任务状态、验收门和自我改进，更新成本是否可控
    valuable_evidence: [Read次数, Grep次数, tool call次数, token消耗, 任务成功率, 端到端时延]
    directions:
      - id: code_graph
        name: 代码知识图与仓库索引
        queries:
          - '"code knowledge graph" coding agent'
          - '"repository graph" AI coding'
          - 'CodeGraph coding agent'
          - 'RepoGraph repository indexing'
        aihot_queries:
          - code graph agent
          - repository indexing agent
          - CodeGraph
          - RepoGraph
        arxiv_query: '(("code knowledge graph" OR "repository graph" OR CodeGraph OR RepoGraph) AND agent)'
        include_terms: [code graph, repository graph, indexing, coding agent]
        exclude_terms: [social graph]
      - id: read_grep
        name: Read、Grep、Glob和代码搜索加速
        queries:
          - '"coding agent" read grep glob acceleration'
          - '"AI coding agent" code search tool calls'
          - 'agent repository search latency'
        aihot_queries:
          - coding agent grep
          - coding agent code search
          - agent read tool
          - repository search agent
        arxiv_query: '(("coding agent" OR "software engineering agent") AND ("code search" OR grep OR repository))'
        include_terms: [coding agent, read, grep, glob, code search, repository]
        exclude_terms: []
      - id: context_building
        name: 上下文定位、构建与裁剪
        queries:
          - '"coding agent" context retrieval repository indexing'
          - '"software engineering agent" repository map'
          - 'agent context pruning codebase'
        aihot_queries:
          - agent context retrieval
          - repository map agent
          - coding agent context
          - agent context pruning
        arxiv_query: '(("coding agent" OR "software engineering agent") AND ("context retrieval" OR "repository map" OR indexing))'
        include_terms: [agent, context, repository, retrieval, indexing, pruning]
        exclude_terms: []
      - id: tool_chain
        name: Agent工具执行链优化
        queries:
          - '"agent runtime" parallel tool calls'
          - '"speculative tool execution" agent'
          - '"tool-call reduction" agent'
          - 'agent workflow execution latency'
        aihot_queries:
          - agent runtime
          - parallel tool calls
          - speculative tool execution
          - tool call reduction
        arxiv_query: '((agent OR agentic) AND ("parallel tool calls" OR "speculative tool" OR "tool-call"))'
        include_terms: [agent, tool call, runtime, parallel, speculative, execution]
        exclude_terms: []
      - id: agent_harness
        name: Agent Harness与长任务运行环境
        queries:
          - '"agent harness" long-running coding agent state evaluation'
          - '"coding harness" agent workflow acceptance gate'
          - '"agentic coding" harness runtime state'
          - '"agentic workflow" harness self-improvement'
          - '"agentic system" harness evaluation runtime'
        aihot_queries:
          - agent harness
          - coding harness
          - agentic coding harness
          - agentic workflow runtime
          - agentic system evaluation
        arxiv_query: '(("agent harness" OR "coding harness" OR "agentic coding" OR "agentic workflow" OR "agentic system") AND (runtime OR state OR evaluation OR "acceptance gate" OR "self-improvement"))'
        include_terms: [agent harness, coding harness, agentic coding, agentic workflow, agentic system, runtime, state, evaluation]
        exclude_terms: [biomedical, healthcare workflow, business workflow, marketing automation]

  - id: cross_region
    name: 跨域传输
    description: KVCache、Agent Cache、工具结果和记忆在跨地域或跨集群环境中的传输、放置与一致性。
    max_items_per_issue: 2
    aihot_priority: high
    aihot_boost_terms: [cross-region KV cache, remote prefill, agent memory, distributed cache]
    current_questions:
      - KVCache跨域传输在什么场景值得付出WAN成本
      - Agent Cache、工具结果和记忆能否跨域复用
      - 压缩、增量传输和预取如何降低带宽与时延
    valuable_evidence: [WAN RTT, 传输字节数, 缓存命中率, P95时延, 压缩比, 一致性开销]
    directions:
      - id: kv_cross_region
        name: KVCache跨域迁移与远程访问
        queries:
          - '"cross-region KV cache"'
          - '"remote KV cache" WAN'
          - '"KV cache migration" distributed inference'
        aihot_queries: [cross-region KV cache, remote KV cache, KV cache migration]
        arxiv_query: '("cross-region KV cache" OR "remote KV cache" OR "KV cache migration")'
        include_terms: [kv cache, remote, cross-region, migration, wan]
        exclude_terms: [cpu cache]
      - id: remote_prefill
        name: Prefill/Decode跨域解耦
        queries:
          - '"remote prefill" KV cache handoff'
          - '"prefill decode disaggregation" WAN'
          - '"KV cache handoff" network placement'
        aihot_queries: [remote prefill, KV cache handoff, disaggregated inference]
        arxiv_query: '(("remote prefill" OR "KV cache handoff") AND (network OR WAN OR placement))'
        include_terms: [prefill, decode, kv cache, handoff, remote]
        exclude_terms: []
      - id: agent_cache
        name: Agent Cache、工具结果与记忆共享
        queries:
          - '"distributed agent memory"'
          - '"cross-region agent cache"'
          - '"tool result sharing" agent distributed'
        aihot_queries: [distributed agent memory, agent cache, tool result sharing]
        arxiv_query: '((agent AND (memory OR cache OR "tool result")) AND distributed)'
        include_terms: [agent, cache, memory, tool result, distributed]
        exclude_terms: []
      - id: transfer_placement
        name: 压缩、增量传输、预取与放置
        queries:
          - 'KV cache compression transfer prefetch placement'
          - 'distributed cache incremental transfer WAN'
        aihot_queries: [KV cache compression, cache prefetch placement, incremental transfer]
        arxiv_query: '(("KV cache" OR "distributed cache") AND (compression OR prefetch OR placement OR "incremental transfer"))'
        include_terms: [cache, compression, prefetch, placement, transfer]
        exclude_terms: []
      - id: consistency_isolation
        name: 跨域一致性、安全与多租户隔离
        queries:
          - 'cross-region cache consistency multi-tenant isolation'
          - 'distributed agent memory security consistency'
        aihot_queries: [agent memory security, cross-region cache consistency]
        arxiv_query: '(("cross-region cache" OR "distributed agent memory") AND (consistency OR security OR multi-tenant))'
        include_terms: [cross-region, distributed, consistency, security, multi-tenant]
        exclude_terms: []

  - id: optical_network
    name: 光交换网络
    description: AI/GPU集群中的光路交换、动态拓扑重构、电光混合网络和工程部署。
    max_items_per_issue: 2
    aihot_priority: low
    aihot_boost_terms: [optical circuit switching, OCS, AI datacenter optics]
    current_questions:
      - 光交换如何适配AI集群的动态通信模式
      - 拓扑重构收益是否覆盖重配置和调度开销
      - 电光混合网络的部署、容错与端到端收益如何
    valuable_evidence: [重配置时延, 链路利用率, 作业完成时间, 拓扑收益, 故障恢复时间]
    directions:
      - id: ai_ocs
        name: AI集群光交换架构
        queries:
          - '"optical circuit switching" AI cluster'
          - 'OCS GPU datacenter network'
          - 'optical switching AI datacenter'
        aihot_queries: [optical switching AI cluster]
        arxiv_query: '(("optical circuit switching" OR OCS) AND (AI OR GPU OR datacenter))'
        include_terms: [optical, ocs, gpu, datacenter, switching]
        exclude_terms: [optical character recognition]
      - id: topology_reconfiguration
        name: 动态拓扑和光路调度
        queries:
          - '"reconfigurable datacenter network" optical scheduling'
          - '"demand-aware network" OCS topology'
        aihot_queries: [reconfigurable datacenter optical]
        arxiv_query: '(("reconfigurable datacenter network" OR "demand-aware network") AND optical)'
        include_terms: [reconfigurable, topology, optical, scheduling]
        exclude_terms: []
      - id: hybrid_network
        name: 电光混合网络
        queries:
          - '"hybrid electrical optical network" datacenter'
          - 'electrical optical switching GPU cluster'
        aihot_queries: [hybrid electrical optical network]
        arxiv_query: '("hybrid electrical optical" AND datacenter)'
        include_terms: [hybrid, electrical, optical, datacenter]
        exclude_terms: []
      - id: deployment_recovery
        name: 部署、故障恢复与端到端收益
        queries:
          - 'optical circuit switch failure recovery datacenter'
          - 'OCS deployment reconfiguration latency'
        aihot_queries: [OCS deployment, optical switch failure recovery]
        arxiv_query: '((OCS OR "optical circuit switch") AND (deployment OR failure OR recovery OR reconfiguration))'
        include_terms: [optical, deployment, failure, recovery, reconfiguration]
        exclude_terms: []

  - id: ai_infra_horizontal
    name: AI Infra横向动态
    description: >-
      覆盖与AI语义Fabric直接相关、但无法准确归入前六个专题的横向基础设施进展；
      只收录系统、运行时、集群、加速器、内存、互联与工程可靠性内容，不收录泛商业AI新闻。
    max_items_per_issue: 3
    aihot_priority: highest
    aihot_boost_terms:
      - LLM serving
      - inference engine
      - GPU cluster
      - collective communication
      - compiler kernel
      - AI infrastructure
      - distributed training
      - observability
    current_questions:
      - 哪些系统与硬件变化会直接影响AI训练、推理或Agent端到端效率
      - 新机制是否提供端到端数据、真实部署规模或明确工程边界
      - 该进展后续应归入哪个既有专题，还是保持横向观察
    valuable_evidence: [端到端时延, 吞吐, GPU利用率, 集群规模, 成本, 故障恢复时间, 部署数据]
    directions:
      - id: serving_runtime_compiler
        name: 推理服务、运行时与编译优化
        queries:
          - 'LLM serving inference engine runtime optimization'
          - 'GPU kernel compiler inference latency throughput'
          - 'LLM quantization runtime production benchmark'
        aihot_queries: [LLM serving, inference engine, GPU kernel, inference compiler]
        arxiv_query: '(("LLM serving" OR "inference engine" OR "GPU kernel" OR compiler) AND (latency OR throughput OR scheduling))'
        include_terms: [llm serving, inference engine, runtime, compiler, gpu kernel, quantization]
        exclude_terms: [marketing, consumer app]
      - id: cluster_training_operations
        name: GPU集群、分布式训练与工程可靠性
        queries:
          - 'GPU cluster collective communication AI infrastructure'
          - 'distributed training scheduling observability failure recovery'
          - 'AI cluster resource scheduling production'
        aihot_queries: [GPU cluster, distributed training, collective communication, AI infrastructure observability]
        arxiv_query: '(("GPU cluster" OR "distributed training" OR collective) AND (scheduling OR observability OR failure OR recovery))'
        include_terms: [gpu cluster, distributed training, collective, scheduling, observability, failure recovery]
        exclude_terms: [gaming, cryptocurrency]
      - id: accelerator_memory_interconnect
        name: 加速器、内存、存储与AI Fabric
        queries:
          - 'AI accelerator HBM CXL storage interconnect architecture'
          - 'AI Fabric RDMA CPO GPU cluster performance'
          - 'accelerator memory hierarchy AI infrastructure'
        aihot_queries: [AI accelerator, HBM CXL, AI Fabric, GPU interconnect]
        arxiv_query: '((accelerator OR HBM OR CXL OR RDMA OR CPO OR "AI Fabric") AND (AI OR GPU) AND performance)'
        include_terms: [accelerator, hbm, cxl, storage, interconnect, ai fabric, rdma, cpo]
        exclude_terms: [consumer gpu, gaming]
