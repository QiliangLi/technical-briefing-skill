version: 1

# source_level is credibility of the page itself. discovery_only=true means the
# item must be traced to a primary source before it can become a重点信息。
sources:
  - id: aihot
    name: AI HOT
    type: aihot
    enabled: true
    source_level: B
    discovery_only: true
    endpoint: https://aihot.virxact.com/api/v1/items
    api_base: https://aihot.virxact.com/api/v1
    window: 7d
    base_selected_limit: 50
    hot_topics_enabled: true
    daily_enabled: true
    query_limits:
      highest: 40
      high: 30
      medium: 15
      low: 0
    topic_boosts:
      agent_acceleration: 1.50
      tpn: 1.35
      cross_region: 1.35
      ai_chip_accelerator: 1.35
      accelerator_io_datapath: 1.35
      memory_dsa: 1.10
      dpu_inline: 1.10
      optical_network: 1.00
      ai_infra_horizontal: 1.50
    notes: >-
      对AI、Agent、KVCache、AI芯片、加速器存储I/O和推理系统方向提高采集频次与候选排序；
      最终结论仍需回到links.original指向的一手来源。

  - id: arxiv
    name: arXiv
    type: arxiv
    enabled: true
    source_level: A
    discovery_only: false
    endpoint: https://export.arxiv.org/api/query
    max_results_per_direction: 20
    request_interval_seconds: 3.0
    categories: [cs.DC, cs.NI, cs.OS, cs.PF, cs.SE, cs.LG, cs.CL, cs.AI]

  - id: openreview_agent_search
    name: OpenReview（Agent检索任务）
    type: agent_web
    enabled: true
    source_level: A
    discovery_only: false
    domains: [openreview.net]
    cadence: daily

  - id: simon_willison
    name: Simon Willison's Weblog
    type: rss
    enabled: true
    source_level: B
    discovery_only: false
    url: https://simonwillison.net/atom/everything/
    topic_allowlist: [agent_acceleration]

  - id: latent_space
    name: Latent Space
    type: rss
    enabled: true
    source_level: B
    discovery_only: false
    url: https://www.latent.space/feed
    topic_allowlist: [agent_acceleration, tpn, cross_region]

  - id: interconnects
    name: Interconnects
    type: rss
    enabled: true
    source_level: B
    discovery_only: false
    url: https://www.interconnects.ai/feed
    topic_allowlist: [agent_acceleration, tpn]

  - id: semianalysis
    name: SemiAnalysis
    type: rss
    enabled: true
    source_level: B
    discovery_only: false
    url: https://newsletter.semianalysis.com/feed
    topic_allowlist: [tpn, memory_dsa, dpu_inline, cross_region, optical_network, ai_chip_accelerator, accelerator_io_datapath]

  - id: huggingface_papers
    name: Hugging Face Papers
    type: agent_web
    enabled: true
    source_level: B
    discovery_only: true
    domains: [huggingface.co/papers]
    topic_allowlist: [agent_acceleration, tpn, cross_region]
    cadence: daily

  - id: ai_news
    name: AI News by smol.ai
    type: agent_web
    enabled: true
    source_level: B
    discovery_only: true
    domains: [news.smol.ai]
    topic_allowlist: [agent_acceleration, tpn, cross_region, ai_chip_accelerator, accelerator_io_datapath]
    cadence: daily

  - id: alphaxiv
    name: alphaXiv
    type: conditional
    enabled: true
    source_level: B
    discovery_only: true
    trigger: high_scoring_paper_only

  - id: the_batch
    name: The Batch
    type: manual_weekly
    enabled: true
    source_level: B
    discovery_only: true
    cadence: weekly

  - id: lmarena
    name: LMArena
    type: conditional
    enabled: true
    source_level: A
    discovery_only: false
    trigger: agent_or_code_benchmark_change

  - id: artificial_analysis
    name: Artificial Analysis
    type: conditional
    enabled: true
    source_level: A
    discovery_only: false
    trigger: material_model_quality_speed_or_price_change

  - id: openrouter_rankings
    name: OpenRouter Rankings
    type: conditional
    enabled: true
    source_level: A
    discovery_only: false
    trigger: ecosystem_adoption_trend_only

  - id: github_releases
    name: GitHub重点项目Release
    type: github_releases
    enabled: true
    source_level: A
    discovery_only: false
    repositories:
      # Add repositories as the project develops. Examples are intentionally
      # conservative so the initial install does not create a noisy feed.
      - repo: LMCache/LMCache
        topic: tpn
        direction: kv_transfer
      - repo: vllm-project/vllm
        topic: tpn
        direction: pd_disaggregation
      - repo: sgl-project/sglang
        topic: tpn
        direction: pd_disaggregation
        enabled: false

  - id: agent_web_search
    name: 当前Agent开放搜索
    type: agent_web
    enabled: true
    source_level: B
    discovery_only: true
    cadence: daily
    notes: 由当前Agent使用自身Web工具完成，不要求额外搜索API Key。

  - id: follow_builders
    name: Follow Builders
    type: follow_builders
    enabled: true
    source_level: B
    discovery_only: true
    feeds:
      x: https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-x.json
      podcasts: https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-podcasts.json
      blogs: https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-blogs.json
    base_priorities:
      x: 8
      podcasts: 12
      blogs: 14
    topic_boosts:
      agent_acceleration: 1.30
      ai_infra_horizontal: 1.25
      tpn: 1.10
      cross_region: 1.10
      ai_chip_accelerator: 1.10
      accelerator_io_datapath: 1.10
      memory_dsa: 0.90
      dpu_inline: 0.90
      optical_network: 0.80
    max_x_items: 40
    max_podcast_items: 8
    max_blog_items: 20
    skip_short_x_chars: 60
    notes: >-
      只作为Builder观点、访谈和官方博客线索源；
      推文和播客观点不得独立支撑重点技术结论。

  - id: yeekal_daily
    name: YeeKal AI Daily
    type: yeekal_daily
    enabled: true
    source_level: B
    discovery_only: true
    rss_url: https://yeekal.com/rss/daily.xml
    index_url: https://yeekal.com/daily/
    max_issue_pages: 3
    max_external_links_per_issue: 40
    base_priority: 14
    topic_boosts:
      agent_acceleration: 1.35
      ai_infra_horizontal: 1.35
      tpn: 1.20
      cross_region: 1.15
      ai_chip_accelerator: 1.15
      accelerator_io_datapath: 1.15
      memory_dsa: 1.00
      dpu_inline: 1.00
      optical_network: 0.90
    notes: >-
      只提取日报中的外部原始链接和邻近说明；
      不把YeeKal的摘要、洞察和评分直接作为技术证据。
