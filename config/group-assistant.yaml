# 飞书群助手的静态配置。可以公开。
#
# 模式开关、规则开关和静音不在这里：它们是本地状态，由
# `briefing.py assistant mode|rules|mute` 修改。
#
# 群白名单含内部群 ID，放在被忽略的 workspace/assistant/config.local.yaml 里，
# 用 `briefing.py assistant chat add <oc_...>` 写入，会覆盖本文件的同名项。

# 公开站点地址，回复里的链接都指向它下面。
site_base_url: https://qiliangli.github.io/technical-briefing-skill/

# lark-cli 可执行文件。
lark_cli: lark-cli

# 主动推荐的成形闸门只在这个时间段内评估。0 表示周一。
working_hours:
  start: 9
  end: 19
working_days: [0, 1, 2, 3, 4]
