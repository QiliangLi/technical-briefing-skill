<!doctype html>
<html lang="zh-CN" data-accent="ikb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Briefing Cards</title>
<style>
:root{--ink:#111;--paper:#f4f3ef;--accent:#002fa7;--muted:#707070;--line:#b8b8b3;--sans:Inter,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:#d9d9d6;font-family:var(--sans);color:var(--ink)}.sheet{display:flex;flex-direction:column;align-items:center;gap:48px;padding:48px}.poster{position:relative;background:var(--paper);overflow:hidden}.poster.xhs{width:1080px;height:1440px}.poster.wide{width:2100px;height:900px}.content{height:100%;padding:72px 78px;display:flex;flex-direction:column}.stack{display:flex;flex-direction:column}.gap-5{gap:28px}.gap-7{gap:42px}.chrome-min,.meta-strip{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:14px;font-family:var(--mono);font-size:19px;letter-spacing:.08em;text-transform:uppercase}.meta-strip{margin-top:auto;border-bottom:0;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:17px}.t-cat{color:var(--accent);font-weight:700}.t-meta{color:var(--muted)}.h-xl{font-size:82px;line-height:1.08;letter-spacing:-.04em;font-weight:350;margin:0;max-width:96%}.wide .h-xl{font-size:112px}.lead{font-size:31px;line-height:1.5;margin:0;max-width:94%}.cover-metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-top:auto}.cover-metrics div{padding:30px 24px;border-right:1px solid var(--line)}.cover-metrics div:last-child{border-right:0}.cover-metrics strong{display:block;font-size:66px;font-weight:300;color:var(--accent)}.cover-metrics span{font-family:var(--mono);font-size:19px}.visual-well,.visual-placeholder{height:360px;border:1px solid var(--line);margin:0;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual-well img{width:100%;height:100%;object-fit:contain}.visual-placeholder{flex-direction:column;gap:28px;color:var(--muted);font-family:var(--mono);text-transform:uppercase}.node-row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}.diagram-node{border:2px solid var(--ink);padding:18px 24px;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:22px}.diagram-node:nth-child(2){background:var(--accent);color:white;border-color:var(--accent)}.three-points{display:grid;grid-template-columns:1fr;gap:12px}.three-points>div{display:grid;grid-template-columns:100px 1fr;border-top:1px solid var(--line);padding-top:14px}.three-points span{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:20px}.three-points p{font-size:24px;line-height:1.45;margin:0}.tag-row{display:flex;gap:10px;flex-wrap:wrap}.tag{font-family:var(--mono);font-size:17px;border:1px solid var(--ink);padding:8px 12px}.stacked-ledger{display:flex;flex-direction:column;border-top:2px solid var(--ink)}.ledger-row{display:grid;grid-template-columns:90px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)}.ledger-row b{font-family:var(--mono);font-size:42px;color:var(--accent)}.ledger-row p{font-size:30px;line-height:1.35;margin:0}.brief-closing{background:var(--ink);color:var(--paper)}.brief-closing .t-cat,.brief-closing .ledger-row b{color:#7fa0ff}.brief-closing .ledger-row{border-color:#444}.brief-closing .meta-strip{color:#aaa;border-color:#444}.brief-item .h-xl{font-size:64px;line-height:1.04}.brief-item .lead{font-size:27px;line-height:1.4}.brief-item .visual-well,.brief-item .visual-placeholder{height:230px;min-height:230px;flex:0 0 230px}.brief-item .three-points p{font-size:22px;line-height:1.4}@media(max-width:1200px){.sheet{transform-origin:top left}}
</style>
</head>

</html>
