<!doctype html>

    <link rel="stylesheet" href="./editorial-tokens.css?v=20260901k" />

  <body>
    <a class="skip-link" href="#appMain">跳到主要内容</a>
    <header class="app-nav">
      <div class="app-inner nav-inner">
        <a class="brand" href="#home" aria-label="技术情报工作台首页">
          <img src="./assets/brand-mark.svg" alt="" width="46" height="58" />
          <span>技术情报工作台</span>
        </a>
        <nav id="primaryNav" class="primary-nav" aria-label="一级导航">
          <a href="#home" data-route="home">首页</a>
          <a href="#roadmaps" data-route="roadmaps">Roadmap</a>
          <a href="#ideas" data-route="ideas">Idea Hub</a>
          <a href="#knowledge" data-route="knowledge">知识图谱</a>
          <a href="#archive" data-route="archive">归档</a>
        </nav>
        <button id="searchTrigger" class="search-trigger" type="button" aria-haspopup="dialog">
          <svg aria-hidden="true"><use href="./assets/icons.svg#search"></use></svg>
          <span>搜索 Topic、Roadmap、Idea、Claim、论文或来源</span>
          <kbd>⌘ K</kbd>
        </button>
        <a class="account-link" href="https://github.com/QiliangLi/technical-briefing-skill" target="_blank" rel="noreferrer" aria-label="在 GitHub 查看项目">
          <svg aria-hidden="true"><use href="./assets/icons.svg#user"></use></svg>
        </a>
        <button id="menuToggle" class="menu-toggle" type="button" aria-controls="primaryNav" aria-expanded="false" aria-label="打开导航菜单">
          <svg aria-hidden="true"><use href="./assets/icons.svg#menu"></use></svg>
        </button>
      </div>

    <div id="loadBanner" class="load-banner" role="status" hidden></div>
    <main id="appMain" class="app-main app-inner" tabindex="-1" aria-live="polite">
      <div class="route-loading" aria-label="页面加载中"><span></span><span></span><span></span></div>
    </main>
    <dialog id="searchDialog" class="search-dialog" aria-labelledby="searchTitle">
      <div class="search-dialog-head">
        <div><p id="searchTitle">搜索工作台</p><span>在公开归档与长期知识中查找</span></div>
        <button class="icon-button" type="button" data-close-search aria-label="关闭搜索"><svg aria-hidden="true"><use href="./assets/icons.svg#close"></use></svg></button>
      </div>
      <label class="search-field">
        <svg aria-hidden="true"><use href="./assets/icons.svg#search"></use></svg><span class="sr-only">搜索</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="输入 Topic、Idea、Claim、论文或来源" />
      </label>
      <div id="searchResults" class="search-results" aria-live="polite"></div>
    </dialog>
    <script src="./assets/vendor/cytoscape.min.js?v=3.34.2"></script>
    <script src="./data-contract.js?v=20260901k"></script>
    <script src="./graph-styles.js?v=20260901k"></script>
    <script src="./graph-renderer.js?v=20260901k"></script>
    <script src="./knowledge-graph-view.js?v=20260901k"></script>
    <script src="./idea-evidence-view.js?v=20260901k"></script>
