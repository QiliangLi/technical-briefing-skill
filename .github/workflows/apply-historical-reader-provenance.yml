name: Apply historical reader provenance backfill

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-historical-reader-provenance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-reader-provenance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Add immutable reader backup support
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('briefing_skill/archive_reader.py')
          s = p.read_text()
          marker = '''def existing_original_html(issue_dir: Path) -> dict[str, str]:\n'''
          insert = '''def backup_original_reader(\n    issue_dir: Path,\n    *,\n    replacement: dict[str, Any] | None = None,\n) -> str | None:\n    """Preserve the reader projection that is about to be replaced."""\n\n    source = issue_dir / "reader.json"\n    if not source.is_file():\n        return None\n    target = issue_dir / "original" / "reader.json"\n    if target.exists():\n        return _sha256_file(target)\n    if replacement is not None and read_json(source, {}) == replacement:\n        return None\n    target.parent.mkdir(parents=True, exist_ok=True)\n    shutil.copy2(source, target)\n    return _sha256_file(target)\n\n\n'''
          if marker not in s:
              raise SystemExit('existing_original_html marker not found')
          if 'def backup_original_reader(' not in s:
              s = s.replace(marker, insert + marker)

          old_apply = '''    if reader.get("rewrite_status") != "historical_semantic_rewrite":\n        raise ValueError("historical apply requires rewrite_status=historical_semantic_rewrite")\n    originals = (\n'''
          new_apply = '''    if reader.get("rewrite_status") != "historical_semantic_rewrite":\n        raise ValueError("historical apply requires rewrite_status=historical_semantic_rewrite")\n    backup_original_reader(issue_dir, replacement=reader)\n    originals = (\n'''
          if old_apply not in s:
              raise SystemExit('historical apply marker not found')
          s = s.replace(old_apply, new_apply)

          old_names = '''        "original/email.html",\n        "original/email-illustrated.html",\n    )\n'''
          new_names = '''        "original/email.html",\n        "original/email-illustrated.html",\n        "original/reader.json",\n        "original/provenance.json",\n    )\n'''
          if old_names not in s:
              raise SystemExit('manifest file-list marker not found')
          s = s.replace(old_names, new_names)
          p.write_text(s)

          p = Path('tests/test_archive_reader.py')
          s = p.read_text()
          old_import = '''    apply_historical_rewrite,\n    issue_hash,\n'''
          new_import = '''    apply_historical_rewrite,\n    backup_original_reader,\n    issue_hash,\n'''
          if old_import not in s:
              raise SystemExit('archive-reader test import marker not found')
          s = s.replace(old_import, new_import)
          anchor = '''def test_historical_rewrite_preserves_only_real_original_and_is_idempotent(tmp_path: Path) -> None:\n'''
          test = '''def test_original_reader_backup_is_immutable(tmp_path: Path) -> None:\n    issue_dir = tmp_path / "archive" / "issues" / "2026-08-20"\n    write_json(issue_dir / "reader.json", {"version": "legacy", "takeaway": "完整旧内容"})\n\n    first_hash = backup_original_reader(issue_dir)\n    original = (issue_dir / "original" / "reader.json").read_bytes()\n    write_json(issue_dir / "reader.json", {"version": "new"})\n    second_hash = backup_original_reader(issue_dir)\n\n    assert (issue_dir / "original" / "reader.json").read_bytes() == original\n    assert first_hash == second_hash\n\n\n'''
          if anchor not in s:
              raise SystemExit('archive-reader test insertion marker not found')
          if 'def test_original_reader_backup_is_immutable' not in s:
              s = s.replace(anchor, test + anchor)
          p.write_text(s)
          PY

      - name: Restore six pre-v2 provenance snapshots
        run: python scripts/backfill_archive_provenance.py
      - name: Validate provenance and archive behavior
        run: |
          python scripts/backfill_archive_provenance.py --check
          python -m pytest -q tests/test_archive_provenance.py tests/test_archive_reader.py
      - name: Commit backfill and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-historical-reader-provenance.yml
          git add -- \
            briefing_skill/archive_reader.py \
            tests/test_archive_reader.py \
            archive/issues/*/original/reader.json \
            archive/issues/*/original/email-illustrated.html \
            archive/issues/*/original/provenance.json \
            archive/issues/*/publication-manifest.json
          git add -u -- .github/workflows/apply-historical-reader-provenance.yml
          git commit -m 'fix: preserve pre-v2 archive provenance'
          git push origin HEAD:fix/historical-reader-provenance
