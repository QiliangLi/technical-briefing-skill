name: Apply historical Reader v2 migration

on:
  push:
    branches: [feat/migrate-historical-reader-v2]
    paths:
      - 'scripts/migrate_historical_reader_v2.py'
      - '.github/workflows/apply-historical-reader-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-reader-v2-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/migrate-historical-reader-v2
      - name: Migrate committed archives
        run: python scripts/migrate_historical_reader_v2.py
      - name: Commit generated reader documents and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-historical-reader-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            archive/issues/2026-08-02/reader.json \
            archive/issues/2026-08-06/reader.json \
            archive/issues/2026-08-10/reader.json \
            archive/issues/2026-08-11/reader.json \
            archive/issues/2026-08-15/reader.json \
            archive/issues/2026-08-17/reader.json \
            .github/workflows/apply-historical-reader-v2.yml
          git commit -m 'chore: migrate historical readers to blocks v2'
          git push origin HEAD:feat/migrate-historical-reader-v2
