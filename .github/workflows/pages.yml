name: Deploy technical intelligence site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'archive/**'
      - 'knowledge/**'
      - 'pics/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/technical-intel-site"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp -R site/. "$publish_dir/"
          cp -R archive "$publish_dir/archive"
          cp -R knowledge "$publish_dir/knowledge"
          cp -R pics "$publish_dir/pics"
          touch "$publish_dir/.nojekyll"

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/technical-intel-site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan pages-publish
          git rm -rf .
          cp -R "$publish_dir/." .
          git add -A
          git commit -m "pages: publish ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
