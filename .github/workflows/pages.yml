name: Deploy technical intelligence site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'archive/**'
      - 'knowledge/**'
      - 'pics/**'
      - 'briefing.py'
      - 'briefing_skill/knowledge_graph.py'
      - 'briefing_skill/knowledge_materialization.py'
      - 'briefing_skill/bootstrap.py'
      - 'schemas/**'
      - 'scripts/scan_public_traces.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate the derived knowledge graph
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -e .
          # Gate 1: the authoritative knowledge store must itself be schema-
          # and semantic-valid; a malformed Roadmap/Idea must not ride through
          # inside a graph that happens to match the graph schema.
          python3 briefing.py knowledge validate
          # Gate 2: the published graph is regenerated deterministically from
          # the authoritative inputs; validate fails publication when archive
          # or knowledge inputs no longer match the graph being shipped.
          python3 briefing.py knowledge graph build
          python3 briefing.py knowledge graph validate

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/technical-intel-site"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp -R site/. "$publish_dir/"
          cp -R archive "$publish_dir/archive"
          cp -R knowledge "$publish_dir/knowledge"
          cp -R pics "$publish_dir/pics"
          touch "$publish_dir/.nojekyll"

      - name: Scan publication tree for upstream traces
        shell: bash
        run: python3 scripts/scan_public_traces.py "$RUNNER_TEMP/technical-intel-site"

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/technical-intel-site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan pages-publish
          # An orphan branch starts with an empty index, so git rm . fails with
          # "pathspec '.' did not match any files". Clean the runner checkout
          # before copying the assembled publication tree instead.
          git clean -fdx
          cp -R "$publish_dir/." .
          git add -A
          git commit -m "pages: publish ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
