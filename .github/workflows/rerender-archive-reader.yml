name: Re-render archived reader emails

on:
  push:
    branches: [main]
    paths:
      - 'briefing_skill/editorial_intent.py'
      - 'briefing_skill/archive_editorial_layout.py'
      - 'briefing_skill/archive_reader.py'
      - 'briefing_skill/archive_reader_v2.py'
      - 'briefing_skill/reader_blocks_renderer_v2.py'
      - 'briefing_skill/reader_projection_v2.py'
      - 'prompts/reader-item-writing.md'
      - 'prompts/issue-synthesis.md'
      - 'schemas/reader-item-writing.schema.json'
      - 'schemas/archive-reader.schema.json'
      - 'scripts/rerender_archive_reader_layout.py'
      - '.github/workflows/rerender-archive-reader.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-reader-rerender
  cancel-in-progress: true

jobs:
  rerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Re-render all archived public variants
        run: python scripts/rerender_archive_reader_layout.py
      - name: Commit generated archive views
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- archive/issues; then
            echo 'Archive reader views already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add archive/issues/*/email.html archive/issues/*/email-illustrated.html archive/issues/*/publication-manifest.json
            git commit -m 'chore: rerender archived reader emails'
            git push origin HEAD:main
          fi

      # A push made with GITHUB_TOKEN does not trigger another workflow. Publish
      # Pages here directly so the archive commit above cannot leave gh-pages stale.
      - name: Assemble current static site
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/technical-intel-site"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp -R site/. "$publish_dir/"
          cp -R archive "$publish_dir/archive"
          cp -R knowledge "$publish_dir/knowledge"
          cp -R pics "$publish_dir/pics"
          touch "$publish_dir/.nojekyll"

      - name: Publish current archive to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/technical-intel-site"
          published_from="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan pages-publish
          # An orphan branch starts with an empty index. Clean the checkout before
          # copying the assembled publication tree, matching the primary Pages workflow.
          git clean -fdx
          cp -R "$publish_dir/." .
          git add -A
          git commit -m "pages: publish archive reader ${published_from}"
          git push --force origin HEAD:gh-pages
