name: Re-render archived reader emails

on:
  push:
    branches: [main]
    paths:
      - 'briefing_skill/editorial_intent.py'
      - 'briefing_skill/archive_editorial_layout.py'
      - 'prompts/reader-item-writing.md'
      - 'prompts/issue-synthesis.md'
      - 'schemas/reader-item-writing.schema.json'
      - 'scripts/rerender_archive_reader_layout.py'
      - '.github/workflows/rerender-archive-reader.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-reader-rerender
  cancel-in-progress: true

jobs:
  rerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Re-render all archived public variants
        run: python scripts/rerender_archive_reader_layout.py
      - name: Commit generated archive views
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- archive/issues; then
            echo 'Archive reader views already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/issues/*/email.html archive/issues/*/email-illustrated.html archive/issues/*/publication-manifest.json
          git commit -m 'chore: rerender archived reader emails'
          git push origin HEAD:main
