name: Apply PR79 historical reader corrections

on:
  push:
    branches:
      - feat/migrate-historical-reader-v2
    paths:
      - 'scripts/migrate_historical_reader_v2.py'
      - '.github/workflows/apply-pr79-reader-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/migrate-historical-reader-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic migration corrections
        run: python scripts/migrate_historical_reader_v2.py
      - name: Commit corrected archived readers
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- archive/issues/*/reader.json; then
            echo 'Historical readers already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            archive/issues/2026-08-02/reader.json \
            archive/issues/2026-08-06/reader.json \
            archive/issues/2026-08-10/reader.json \
            archive/issues/2026-08-11/reader.json \
            archive/issues/2026-08-15/reader.json \
            archive/issues/2026-08-17/reader.json
          git commit -m 'fix: correct persisted historical reader headings'
          git push origin HEAD:feat/migrate-historical-reader-v2
