name: tests

on:
  pull_request:
  push:
    branches:
      - agent/dual-channel-radar

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q briefing_skill scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Estimate task reduction
        run: python scripts/estimate_efficiency.py
