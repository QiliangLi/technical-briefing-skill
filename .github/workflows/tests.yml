name: tests

on:
  pull_request:
  push:
    branches:
      - agent/dual-channel-radar
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          tracked_runs="$(git ls-files workspace/runs | grep -v '^workspace/runs/.gitkeep$' || true)"
          if [[ -n "$tracked_runs" ]]; then
            echo 'Generated workspace/runs artifacts must never be committed:' >&2
            printf '%s\n' "$tracked_runs" >&2
            exit 1
          fi
          forbidden_paths="$(git ls-files | grep -E '(^|/)agently-send-pending\.json$|(^|/)[^/]*session[^/]*\.jsonl$' || true)"
          if [[ -n "$forbidden_paths" ]]; then
            echo 'Token-bearing send state or raw session transcripts must never be committed:' >&2
            printf '%s\n' "$forbidden_paths" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q briefing_skill scripts tests
      - name: Full bootstrap demo smoke
        env:
          BRIEFING_SKIP_DOTENV: '1'
        run: python briefing.py demo --run ci-demo-direct
      - name: Test
        run: python -m pytest -q
      - name: Golden quality eval
        run: python scripts/run_golden_eval.py
      - name: Evidence repair smoke
        env:
          BRIEFING_SKIP_DOTENV: '1'
        run: python scripts/smoke_evidence_repair.py
      - name: Historical backfill status smoke
        env:
          BRIEFING_SKIP_DOTENV: '1'
        run: python briefing.py backfill-status
      - name: Stats smoke
        env:
          BRIEFING_SKIP_DOTENV: '1'
        run: python briefing.py stats --run ci-demo-direct
      - name: Repeated demo relevance-cache smoke
        env:
          BRIEFING_SKIP_DOTENV: '1'
        run: |
          python briefing.py demo --run ci-demo-repeat
          python briefing.py stats --run ci-demo-repeat
      - name: Estimate task reduction
        run: python scripts/estimate_efficiency.py
