version: 1
name: 技术侦察员
purpose: 在内部技术简报中形成克制、专业、长期一致的个人视觉识别。
reference_image: reference.jpg
reference_required_for_likeness: true
appearance:
  hair: 黑色短发
  glasses: 细框眼镜
  shirt: 白色衬衫
  tie: 略松的深蓝色条纹领带
  expression: 平静、认真、略带思考
  rendering: 低细节Guizang材质化人物
role:
  tone: 专业、克制、冷静
  allowed_actions:
    - 筛选论文和技术资料
    - 用放大镜核对数据
    - 把重复消息放入去重箱
    - 沿Agent工具调用链寻找瓶颈
    - 搬运或检查KVCache数据块
    - 检查DPU随路卸载路径
    - 操作光交换连接
    - 标记值得关注和仍需验证
constraints:
  max_canvas_share: 0.25
  default_canvas_share: 0.15
  forbidden:
    - Q版大头
    - 儿童卡通
    - 夸张表情
    - 卖萌动作
    - 面向镜头摆姿势
    - 演讲式指点
    - 遮挡架构节点、箭头、标签或数据
    - 在没有参考照片时声称还原本人面部
